# Despliegue a Azure App Service (Linux, Node). Monorepo: la app está en web/.
#
# Secretos en GitHub → Settings → Secrets and variables → Actions:
#   AZURE_WEBAPP_PUBLISH_PROFILE — XML completo (Portal → Web App → Descargar perfil de publicación)
#   AZURE_WEBAPP_NAME — nombre de la aplicación web en Azure (ej. savory-app)
#
# Las variables del paso build son placeholders (igual que CI); la app en Azure usa
# Configuration → Application settings (AUTH_SECRET, DATABASE_URL, etc.).
name: Deploy Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        env:
          AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars-build-only
          AUTH_URL: http://127.0.0.1:3000
          DATABASE_URL: sqlserver://127.0.0.1:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true
          OPENAI_API_KEY: sk-ci-dummy-build-only-not-used
        run: npm ci && npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web
