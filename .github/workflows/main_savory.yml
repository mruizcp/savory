# Azure Deployment Center → GitHub Actions (OIDC). App Next.js en web/ (monorepo).
# Docs: https://github.com/Azure/webapps-deploy
#
# Secretos (GitHub → Settings → Secrets → Actions): Azure suele crearlos al conectar el centro de implementación.
# Si el login falla, comprueba los nombres en el repo; lo habitual es:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
name: Build and deploy Node.js app to Azure Web App - savory

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-deploy-savory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci, build, and test
        env:
          AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars-build-only
          AUTH_URL: http://127.0.0.1:3000
          DATABASE_URL: sqlserver://127.0.0.1:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true
          OPENAI_API_KEY: sk-ci-dummy-build-only-not-used
        run: |
          npm ci
          npm run build
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "savory"
          slot-name: "Production"
          package: .
